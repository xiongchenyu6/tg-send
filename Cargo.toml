[package]
name = "tg-push"
version = "0.1.0"
edition = "2024"
description = "Single-shot CLI for sending text plus an optional image or video to Telegram."
license = "MIT"
readme = "README.md"
repository = "https://github.com/htdt/tg-push"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde_json = "1"
